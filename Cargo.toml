[package]
name = "apex-dentalcraft"
version = "0.3.0-alpha"
edition = "2021"
description = "Apex DentalCraft — Native Rust/OpenGL dental CAD/CAM suite and 3D mesh viewer, offline and portable"

[lib]
name = "apex_dentalcraft_lib"
path = "src/lib.rs"

[[bin]]
name = "apex-dentalcraft"
path = "src/main.rs"

[[bin]]
name = "apex-3d-viewer"
path = "src/bin/apex_3d_viewer.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"
glam = { version = "0.29", features = ["serde"] }
parry3d = "0.31"
stl_io = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
